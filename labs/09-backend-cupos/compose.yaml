services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cursos
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d cursos"]
      interval: 2s
      timeout: 3s
      retries: 20
